<!DOCTYPE html>
<html lang="en" data-color-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koleksi Koin Kuno Jakarta | masdedys.github.io</title>
    <!--title icon-->
    <link rel="shortcut icon" href="../assets/img/logo.png" />
    <link rel="stylesheet" href="../assets/bootstrap-5.2.3/css/bootstrap.min.css"  />
    <link rel="stylesheet" href="../assets/icons-1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- DataTables -->
    <link rel="stylesheet" href="../assets/DataTables/DataTables-2.3.8/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="../assets/DataTables/Responsive-3.0.8/css/responsive.dataTables.min.css">
    <link rel="stylesheet" href="../assets/DataTables/DataTables-2.3.8/css/dataTables.bootstrap5.min.css">

    <link rel="stylesheet" href="../assets/DataTables/Buttons-3.2.6/css/buttons.dataTables.min.css">
    <link rel="stylesheet" href="../assets/css/barber-shop.css" />
    <style>
      body{
       background-color: #2C1D0C;
       color: white;
     }
     table tbody>tr>td{
       color: white;
     }
     .image-list img{
      width: 80%;
      border-radius: 10px;
     }
   </style>
  <body>
    <!--navbar-->
    <nav class="navbar fixed-top navbar-expand-lg nav-underline" style="height: 80px">
      <div class="container">
          <a class="navbar-brand" href="https://masdedys.github.io/">
              <img src="../assets/img/logo.png" alt="" class="d-inline-block align-top shadow" style="border-radius: 10%" />
          </a>
          <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
              <div class="navbar-nav ms-auto">
                  <a class="nav-link mx-3" href="uang-kuno.html">Kembali</a>
              </div>
          </div>
      </div>
    </nav>
    <!--/navbar-->
    <div class="container mt-5">
      <div class="row d-flex flex-wrap flex-row justify-content-center align-content-center py-3">
        <div class="col-md">
          <h1 class="py-4 text-center" id="judul"></h1>
        </div>
        <div class="w-100"></div>
        <div class="col-md-4" id="show-image">
          <img id="img" />
        </div>
        <div class="col-md-6 table-responsive">
          <table class="table table-bordered">
            <tr>
              <td class="caption-description">Negara</td>
              <td id="negara"></td>
            </tr>
            <tr>
              <td class="caption-description-o">Nominal</td>
              <td id="nominal"></td>
            </tr>
            <tr>
              <td class="caption-description">Jenis</td>
              <td id="jenis"></td>
            </tr>
            <tr>
              <td class="caption-description-o">Ciri</td>
              <td id="ciri"></td>
            </tr>
            <tr>
              <td class="caption-description">Satuan</td>
              <td id="satuan"></td>
            </tr>
            <tr>
              <td class="caption-description-o">Tahun</td>
              <td id="tahun"></td>
            </tr>
            <tr>
              <td class="caption-description">No. Seri</td>
              <td id="seri">-</td>
            </tr>
          </table>
        </div>
      </div>
      <hr />
      <div class="row d-flex flex-wrap flex-row justify-content-center align-content-center py-3">
        <div class="col-6">
          <div class="copyright text-white text-center">&copy;2026&nbsp;<a href="https://masdedys.github.io/" class="text-white link-info text-decoration-none">masdedys.github.io</a>, All Rights Reserved</div>
        </div>
      </div>
    </div>
    <script src="../assets/jquery/jquery-3.7.1.js"></script>
    <script src="../assets/bootstrap-5.2.3/js/bootstrap.bundle.min.js"></script>
    <script>
      $.getJSON("../assets/js/listuangkuno.json", function (data) {
        let list = data.uangkuno;
        let noarray = document.cookie;
        //console.log(list);
        document.title = list[noarray].jenis + " " + list[noarray].nominal + " " + list[noarray].satuan + " " + "| masdedys.github.io";
        document.getElementById("judul").innerHTML = list[noarray].jenis + " " + list[noarray].nominal + " " + list[noarray].satuan;
        document.getElementById("negara").innerHTML = list[noarray].negara;
        document.getElementById("nominal").innerHTML = list[noarray].nominal;
        document.getElementById("jenis").innerHTML = list[noarray].jenis;
        document.getElementById("ciri").innerHTML = list[noarray].ciri;
        document.getElementById("satuan").innerHTML = list[noarray].satuan;
        document.getElementById("tahun").innerHTML = list[noarray].tahun;
        document.getElementById("seri").innerHTML = list[noarray].noseri;
        document.getElementById("show-image").innerHTML = `<div class="image-list"><img src ="../assets/uangkuno/${list[noarray].foto}" class="img-thumbnail" alt=""></div>`;
      });
    </script>
  </body>
</html>
